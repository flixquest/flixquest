plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Compiled into libfqcore.so. See tool/scraper_key.dart.
def scraperEnv = new Properties()
def scraperEnvFile = rootProject.file('../.env')
if (scraperEnvFile.exists()) {
    scraperEnvFile.withReader('UTF-8') { reader -> scraperEnv.load(reader) }
}

android {
    namespace 'dev.beamlak.flixquest_v2'
    compileSdk 36
    ndkVersion "28.2.13676358"
    buildToolsVersion "36.0.0"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    defaultConfig {
        applicationId "dev.beamlak.flixquest_v2"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        externalNativeBuild {
            cmake {
                arguments "-DFQ_NATIVE_SECRET=${scraperEnv.getProperty('SCRAPER_NATIVE_SECRET', '')}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    flavorDimensions "environment"
    productFlavors {
        prod {
            dimension "environment"
            manifestPlaceholders = [appLabel: "FlixQuest"]
        }
        dev {
            dimension "environment"
            // Reuse the registered Firebase package; a suffix would require
            // another Firebase Android app and matching Google services file.
            manifestPlaceholders = [appLabel: "FlixQuest Dev"]
        }
    }

    signingConfigs {
       release {
           keyAlias keystoreProperties['keyAlias']
           keyPassword keystoreProperties['keyPassword']
           storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
           storePassword keystoreProperties['storePassword']
       }
   }
   
   buildTypes {
       release {
           signingConfig signingConfigs.release
           shrinkResources true
           minifyEnabled true
       }
   }

    // `flutter build apk --split-per-abi` adds 1000/2000/4000 to each ABI's
    // versionCode. Every APK keeps the pubspec build number instead, so the
    // in-app updater's build comparison holds and devices can move between
    // the universal and per-ABI APKs without a downgrade error. Registered
    // after the Flutter plugin's hook, so it runs last.
    applicationVariants.configureEach { variant ->
        variant.outputs.each { output ->
            output.versionCodeOverride = flutterVersionCode.toInteger()
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    def media3Version = '1.8.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "androidx.media3:media3-database:$media3Version"
    implementation "androidx.media3:media3-datasource:$media3Version"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.media3:media3-transformer:$media3Version"
}
