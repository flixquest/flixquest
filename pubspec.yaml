name: flixquest
description: A Flutter movie app.

publish_to: "none"

version: 4.2.0+6

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  animated_text_kit: ^4.2.2
  better_player_plus:
    path: ../flixquest-betterplayer
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  clipboard: ^0.1.3
  cloud_firestore: ^6.8.0
  cupertino_icons: ^1.0.8
  device_info_plus: ^10.1.2
  dio: ^5.9.0
  dynamic_color: ^1.7.0
  # media_kit: ^1.2.1
  # media_kit_video: ^1.3.1
  # media_kit_libs_video: ^1.0.7
  easy_localization: ^3.0.7
  file_picker: ^8.0.0+1
  firebase_analytics: ^12.4.6
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7
  firebase_in_app_messaging: ^0.9.2+7
  firebase_messaging: ^16.5.0
  firebase_remote_config: ^6.5.6
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  flutter_colorpicker: ^1.1.0
  flutter_dotenv: ^5.2.1
  flutter_download_manager: ^0.5.5
  flutter_downloader: ^1.11.10
  flutter_local_notifications: ^18.0.1
  flutter_localization: ^0.2.2
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.10+1
  freezed_annotation: ^2.4.4
  google_nav_bar: ^5.0.6
  google_sign_in: ^6.2.2
  home_widget: 0.9.2
  http: ^1.2.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  mixpanel_flutter: ^2.13.0
  native_device_orientation: ^2.0.2
  open_filex: ^4.5.0
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.4
  percent_indicator: ^4.2.3
  permission_handler: ^11.3.1
  phosphor_flutter: ^2.1.0
  photo_view: ^0.15.0
  provider: ^6.1.2
  readmore: ^3.0.0
  retry: ^3.1.2
  share_plus: ^10.1.1
  shared_preferences: ^2.3.2
  shimmer: ^3.0.0
  sqflite: ^2.4.0
  startapp_sdk: ^1.0.1
  url_launcher: ^6.3.2
  wakelock_plus: ^1.4.0
  xml: ^6.6.1

dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.2
  flutter_test:
    sdk: flutter
  freezed: ^2.5.8
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/country_flags/
    - assets/images/profiles/
    - assets/translations/
    - assets/ca/
    - .env

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree/Figtree-Medium.ttf
    - family: FigtreeBold
      fonts:
        - asset: assets/fonts/Figtree/Figtree-ExtraBold.ttf
    - family: FigtreeSB
      fonts:
        - asset: assets/fonts/Figtree/Figtree-Bold.ttf
    - family: FigtreeMedium
      fonts:
        - asset: assets/fonts/Figtree/Figtree-Medium.ttf
    - family: FigtreeBlack
      fonts:
        - asset: assets/fonts/Figtree/Figtree-Black.ttf
    - family: FigtreeLight
      fonts:
        - asset: assets/fonts/Figtree/Figtree-Regular.ttf
    - family: SocialIcons
      fonts:
        - asset: assets/fonts/SocialIcons.ttf
    - family: IMdb
      fonts:
        - asset: assets/fonts/imdb.ttf

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#161716"
  image: assets/images/splash_logo.png
  android_12:
    image: assets/images/splash_logo.png
    color: "#FFFFFF"
    color_dark: "#161716"
