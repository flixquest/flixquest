name: flixquest
description: A Flutter movie app.

publish_to: "none"

version: 4.3.2+12

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  animated_text_kit: ^4.2.2
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  clock: ^1.1.2
  connectivity_plus: ^6.1.5
  cupertino_icons: ^1.0.8
  device_info_plus: ^10.1.2
  dio: ^5.9.0
  dio_cache_interceptor: ^4.0.7
  dynamic_color: ^1.7.0
  easy_localization: ^3.0.7
  file_picker: ^8.0.0+1
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  flutter_colorpicker: ^1.1.0
  flutter_download_manager: ^0.5.5
  flutter_downloader: ^1.11.10
  flutter_local_notifications: ^18.0.1
  flutter_localization: ^0.2.2
  flutter_svg: ^2.0.10+1
  freezed_annotation: ^2.4.4
  google_nav_bar: ^5.0.6
  home_widget: 0.9.2
  http: ^1.2.2
  image: ^4.5.4
  intl: ^0.20.2
  json_annotation: ^4.9.0
  mixpanel_flutter: ^2.13.0
  native_device_orientation: ^2.0.2
  open_filex: ^4.5.0
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.4
  percent_indicator: ^4.2.3
  permission_handler: ^11.3.1
  phosphor_flutter: ^2.1.0
  photo_view: ^0.15.0
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  readmore: ^3.0.0
  retry: ^3.1.2
  share_plus: ^10.1.1
  shared_preferences: ^2.3.2
  shimmer: ^3.0.0
  sqflite: ^2.4.0
  url_launcher: ^6.3.2
  wakelock_plus: ^1.4.0
  xml: ^6.6.1

dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.2
  flutter_test:
    sdk: flutter
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  path_provider_platform_interface: ^2.1.2
  sqflite_common_ffi: ^2.3.6

flutter:
  default-flavor: prod
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/profiles/
    - assets/translations/
    - assets/ca/

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree/Figtree-Medium.ttf
    - family: FigtreeBold
      fonts:
        - asset: assets/fonts/Figtree/Figtree-ExtraBold.ttf
    - family: FigtreeSB
      fonts:
        - asset: assets/fonts/Figtree/Figtree-Bold.ttf
    - family: FigtreeMedium
      fonts:
        - asset: assets/fonts/Figtree/Figtree-Medium.ttf
    - family: FigtreeBlack
      fonts:
        - asset: assets/fonts/Figtree/Figtree-Black.ttf
    - family: FigtreeLight
      fonts:
        - asset: assets/fonts/Figtree/Figtree-Regular.ttf
    - family: SocialIcons
      fonts:
        - asset: assets/fonts/SocialIcons.ttf
    - family: IMdb
      fonts:
        - asset: assets/fonts/imdb.ttf

# Regenerating with flutter_native_splash:create rewrites values-v31 and values-night-v31 styles.
# Afterwards, restore the animated icon (@drawable/splash_fq_animated) and its related items.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#161716"
  image: assets/images/splash_logo.png
  android_12:
    image: assets/images/splash_logo.png
    color: "#FFFFFF"
    color_dark: "#161716"
